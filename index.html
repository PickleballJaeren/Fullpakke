<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#050f1f">
<title>Stafettligaen</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stafettliga.css">
</head>
<body>

<!-- ── TOAST / FEILBANNERE ── -->
<div id="toast" class="toast"></div>
<div id="firebase-feil-banner" class="firebase-feil-banner">
  <span id="firebase-feil-tekst"></span>
</div>

<!-- ── HJEM ── -->
<div id="skjerm-hjem" class="screen active">
  <div class="scroll-omrade">
    <div class="hjem-wrap">
      <img src="logo.svg" alt="Stafettligaen" class="hjem-logo">
      <div class="hjem-tittel">Stafettligaen</div>
      <div class="hjem-undertittel">Lagbasert pickleball</div>
    </div>

    <div class="seksjon-etikett">Velg klubb</div>
    <select id="klubb-velger" onchange="byttKlubb(this.value)">
      <option value="">— Velg klubb —</option>
      <option value="pickleball-jaeren">Pickleball Jæren</option>
      <option value="fokus-pickleball">Fokus Pickleball</option>
      <option value="tsi-pickleball">TSI Pickleball</option>
      <option value="loten-pickleball">Løten Tennisklubb</option>
      <option value="demo">Demo</option>
    </select>
    <div id="demo-info" class="sl-regel-boks" style="display:none;margin-top:14px">
      Demo-modus — alle er automatisk admin, ingen PIN kreves.
    </div>
  </div>
</div>

<!-- ── STAFETTLIGA-SKJERMENE ── -->
<div id="skjerm-stafettliga-oversikt" class="screen">
  <div class="app-header">
    <button class="tilbake-btn" onclick="naviger('hjem')">←</button>
    <button class="app-logo" style="background:var(--navy2);border:1px solid var(--border2);cursor:pointer;flex-shrink:0;padding:6px" onclick="naviger('hjem')" title="Hjem"><img src="logo.svg" alt="" style="width:100%;height:100%;object-fit:contain"></button>
    <div style="flex:1">
      <div class="app-name">Stafettligaen</div>
      <div class="app-sub">Oversikt</div>
    </div>
    <div class="header-right" style="display:flex;gap:8px">
      <button class="knapp knapp-primaer knapp-liten" onclick="window.opprettStafettligaSesong?.()">+ Ny</button>
    </div>
  </div>
  <div class="scroll-omrade">
    <div id="stafettliga-oversikt-innhold"></div>
  </div>
</div>

<div id="skjerm-stafettliga-oppsett" class="screen">
  <div class="app-header">
    <button class="tilbake-btn" onclick="naviger('stafettliga-oversikt')">←</button>
    <div style="flex:1">
      <div class="app-name">Ny sesong</div>
      <div class="app-sub">Stafettligaen</div>
    </div>
  </div>
  <div class="scroll-omrade">
    <div id="stafettliga-oppsett-innhold"></div>
  </div>
</div>

<div id="skjerm-stafettliga-lagkamp" class="screen">
  <div class="app-header">
    <button class="tilbake-btn" onclick="window.tilbakeTilStafettligaLagkamper?.()">←</button>
    <div style="flex:1">
      <div class="app-name" id="stafettliga-lagkamp-tittel">Lagkamp</div>
      <div class="app-sub">Stafettligaen</div>
    </div>
  </div>
  <div class="scroll-omrade">
    <div class="sl-fase-faner" id="stafettliga-fase-faner">
      <div class="sl-fase-fane aktiv" data-fase="fase1" onclick="window.byttStafettligaFane?.('fase1')">Nivå</div>
      <div class="sl-fase-fane" data-fase="fase2" onclick="window.byttStafettligaFane?.('fase2')">Mix</div>
      <div class="sl-fase-fane" data-fase="fase3" onclick="window.byttStafettligaFane?.('fase3')">Stafett</div>
    </div>
    <div id="stafettliga-lagkamp-innhold"></div>
  </div>
</div>

<div id="skjerm-stafettliga-tabell" class="screen">
  <div class="app-header">
    <button class="tilbake-btn" onclick="naviger('stafettliga-oversikt')">←</button>
    <div style="flex:1">
      <div class="app-name">Tabell</div>
      <div class="app-sub">Stafettligaen</div>
    </div>
  </div>
  <div class="scroll-omrade">
    <div id="stafettliga-tabell-innhold"></div>
  </div>
</div>

<!-- ── PIN-MODAL (admin) ── -->
<div class="modal-bakgrunn" id="modal-pin" style="display:none" onclick="if(event.target===this)lukkPinModal()">
  <div class="modal">
    <div class="modal-tittel" id="pin-tittel">Admin</div>
    <div class="modal-tekst" id="pin-tekst"></div>
    <div class="pin-rad">
      <input class="pin-siffer" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" id="pin0" oninput="pinInput(0)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
      <input class="pin-siffer" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" id="pin1" oninput="pinInput(1)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
      <input class="pin-siffer" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" id="pin2" oninput="pinInput(2)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
      <input class="pin-siffer" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" id="pin3" oninput="pinInput(3)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
    </div>
    <div class="pin-feil" id="pin-feil"></div>
    <button class="knapp knapp-omriss" style="width:100%" onclick="lukkPinModal()">Avbryt</button>
  </div>
</div>

<script type="module" src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
