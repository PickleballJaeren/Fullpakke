<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050f1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mesteren — Live</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap');
  :root {
    --navy:    #050f1f;
    --navy2:   #0a1628;
    --navy3:   #0d1e35;
    --border:  rgba(30,45,69,.8);
    --border2: rgba(30,45,69,1);
    --white:   #e8f0f8;
    --muted:   #4a6080;
    --muted2:  #7a90a8;
    --green:   #16a34a;
    --green2:  #22c55e;
    --yellow:  #f5c842;
    --accent:  #3b82f6;
    --accent2: #60a5fa;
    --red2:    #ef4444;
    --mv-header-h: 90px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: var(--navy); color: var(--white); font-family: 'DM Sans', system-ui, sans-serif; }
  body { padding-bottom: 40px; }

  /* ════════════ HEADER ════════════ */
  .mv-header {
    position: sticky; top: 0; z-index: 10;
    background: var(--navy2); border-bottom: 1px solid var(--border2);
    padding: 18px 28px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  .mv-header-venstre { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .mv-klubb { font-size: 16px; color: var(--muted2); font-weight: 500; }
  .mv-tittel { font-family: 'Bebas Neue', cursive; font-size: 34px; letter-spacing: 1.5px; color: var(--yellow); }
  .mv-header-hoyre { display: flex; align-items: center; gap: 14px; }
  .mv-live-pill {
    display: inline-flex; align-items: center; gap: 7px;
    background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.35);
    color: var(--green2); font-size: 14px; font-weight: 700; letter-spacing: .5px;
    padding: 6px 14px; border-radius: 20px;
  }
  .mv-live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green2); animation: mv-pulse 1.5s infinite; display: inline-block; }
  @keyframes mv-pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  .mv-ferdig-pill {
    display: inline-flex; align-items: center; gap: 7px;
    background: rgba(96,165,250,.12); border: 1px solid rgba(96,165,250,.35);
    color: var(--accent2); font-size: 14px; font-weight: 700; letter-spacing: .5px;
    padding: 6px 14px; border-radius: 20px;
  }
  .mv-fullskjerm-btn {
    background: var(--navy3); border: 1px solid var(--border2); color: var(--muted2);
    width: 38px; height: 38px; border-radius: 10px; font-size: 18px; cursor: pointer;
  }
  .mv-fullskjerm-btn:hover { color: var(--white); border-color: var(--accent2); }

  .mv-app { max-width: 1400px; margin: 20px auto 0; padding: 0 28px; }
  .mv-tom { text-align: center; color: var(--muted2); font-size: 18px; padding: 90px 20px; line-height: 1.6; }

  /* ════════════ PULJEFASE ════════════ */
  .mv-pulje-body { display: flex; gap: 24px; align-items: flex-start; }
  .mv-pulje-hoved { flex: 1; min-width: 0; }
  .mv-pulje-sidebar { width: 340px; flex-shrink: 0; }
  .mv-pulje-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
  .mv-rotasjon-indikator { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; }
  .mv-prikk { width: 9px; height: 9px; border-radius: 50%; background: var(--border2); transition: background .3s; }
  .mv-prikk.aktiv { background: var(--yellow); }
  .mv-oppgjor-kol { background: var(--navy3); border: 1px solid var(--border2); border-radius: 14px; padding: 14px; }
  .mv-oppgjor-hdr { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 8px; margin-bottom: 10px; border-bottom: 2px solid var(--border2); }
  .mv-oppgjor-tittel { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; }
  .mv-pulje-merke { display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 8px; font-family: 'Bebas Neue', cursive; font-size: 15px; flex-shrink: 0; }
  .mv-disiplin { font-size: 13px; color: var(--muted2); text-transform: uppercase; letter-spacing: .5px; }
  .mv-status-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; letter-spacing: .5px; padding: 3px 9px; border-radius: 10px; margin-bottom: 10px; background: rgba(245,200,66,.14); color: var(--yellow); }
  .mv-status-pill.ferdig { background: rgba(34,197,94,.14); color: var(--green2); }
  .mv-gruppe-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mv-kort { background: var(--navy2); border: 1px solid var(--border2); border-radius: 10px; padding: 9px 10px; }
  .mv-kort.pagar { border-color: var(--green2); }
  .mv-kort-hdr { font-size: 11px; font-weight: 700; color: var(--muted2); text-transform: uppercase; margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }
  .mv-par-rad { font-size: 14px; color: var(--muted2); line-height: 1.4; }
  .mv-par-rad.vinner { color: var(--accent2); font-weight: 700; }
  .mv-vs { text-align: center; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; padding: 2px 0; }
  .mv-resultat { text-align: center; font-family: 'DM Mono', monospace; font-size: 17px; font-weight: 600; color: var(--white); padding-top: 5px; margin-top: 4px; border-top: 1px solid var(--border); }
  .mv-resultat.venter { color: var(--muted); font-size: 12px; font-family: 'DM Sans', sans-serif; }
  .mv-seksjon-tittel { font-size: 14px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted2); font-weight: 700; margin-bottom: 10px; }
  .mv-tabell { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--navy3); border: 1px solid var(--border2); border-radius: 12px; overflow: hidden; }
  .mv-tabell td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .mv-tabell tr:last-child td { border-bottom: none; }
  .mv-tabell-plass { font-family: 'Bebas Neue', cursive; font-size: 17px; }
  .mv-tabell-navn { font-weight: 600; }
  .mv-tabell-hode { font-size: 13px; font-weight: 700; color: var(--muted2); margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
  .mv-tabell-blokk + .mv-tabell-blokk { margin-top: 16px; }
  .sentr { text-align: center; }

  /* ════════════ SLUTTSPILLBRAKETT ════════════ */
  .mv-brakett { display: flex; justify-content: center; gap: 44px; overflow-x: auto; padding: 12px 4px 20px; }
  .mv-brakett-kol { display: flex; flex-direction: column; justify-content: space-around; gap: 20px; flex-shrink: 0; }
  .mv-brakett-kol-tittel { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted2); text-align: center; margin-bottom: 10px; font-weight: 700; }
  .mv-brakett-kamp { background: var(--navy3); border: 1px solid var(--border2); border-radius: 10px; width: 210px; }
  .mv-brakett-kamp.pagar { border-color: var(--green2); box-shadow: 0 0 0 1px var(--green2); }
  .mv-brakett-spiller { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; font-size: 15px; font-weight: 600; }
  .mv-brakett-spiller + .mv-brakett-spiller { border-top: 1px solid var(--border); }
  .mv-brakett-spiller.vinner { color: var(--green2); }
  .mv-brakett-poeng { font-family: 'DM Mono', monospace; color: var(--yellow); }
  .mv-brakett-disiplin { font-size: 10px; color: var(--muted2); text-align: center; padding: 4px 0; text-transform: uppercase; letter-spacing: .5px; }
  .mv-final-boks { background: linear-gradient(135deg, rgba(245,200,66,.1), transparent); border: 1px solid var(--yellow); border-radius: 12px; width: 230px; }
  .mv-final-boks .mv-brakett-spiller { font-size: 17px; }

  /* ════════════ VINNERSKJERM ════════════ */
  .mv-vinner-scene { text-align: center; padding: 60px 20px 40px; }
  .mv-vinner-emoji { font-size: 64px; margin-bottom: 14px; }
  .mv-vinner-label { font-size: 15px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted2); margin-bottom: 10px; }
  .mv-vinner-navn { font-family: 'Bebas Neue', cursive; font-size: 72px; letter-spacing: 2px; color: var(--yellow); line-height: 1; }
  .mv-vinner-sub { font-size: 16px; color: var(--muted2); margin-top: 14px; }
  .mv-hof-strip { margin-top: 40px; display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .mv-hof-item { background: var(--navy3); border: 1px solid var(--border2); border-radius: 10px; padding: 10px 18px; font-size: 14px; color: var(--muted2); }
  .mv-hof-item b { color: var(--white); }

  @media (max-width: 900px) {
    .mv-pulje-body { flex-direction: column; }
    .mv-pulje-sidebar { width: 100%; }
  }
  @media (min-width: 1400px) {
    .mv-tittel { font-size: 42px; }
    .mv-vinner-navn { font-size: 88px; }
    .mv-par-rad, .mv-brakett-spiller { font-size: 17px; }
  }
</style>
</head>
<body>

<div class="mv-header" id="mv-header"></div>
<div class="mv-app" id="mv-app">
  <div class="mv-tom">Laster …</div>
</div>

<script type="module">
import {
  db, SAM, collection, doc, onSnapshot, query, where,
} from './firebase.js';
import {
  beregnSerieStatus, FINALE_DISIPLIN_REKKEFOLGE,
} from './proven-logikk.js';
import { hentLivstidForSpillere } from './proven.js';

// ════════════════════════════════════════════════════════
// Speiler klubbnavnene i app.js — kun til visning i headeren.
// Rør aldri PIN/admin-logikk her, viewer.html er skrivebeskyttet.
// ════════════════════════════════════════════════════════
const KLUBB_NAVN = {
  'pickleball-jaeren': 'Pickleball Jæren',
  'fokus-pickleball':  'Fokus Pickleball',
  'tsi-pickleball':    'TSI Pickleball',
  'loten-pickleball':  'Løten Tennisklubb',
  'demo':              'Demo',
};
const DISIPLIN_NAVN = { pickleball: 'Pickleball', skyball: 'Skyball', speedminton: 'Speedminton' };
const DISIPLIN_IKON = { pickleball: '🏓', skyball: '🏸', speedminton: '🏐' };
const PULJE_FARGE = {
  A: ['rgba(96,165,250,.18)',  'var(--accent2)'],
  B: ['rgba(245,200,66,.18)',  'var(--yellow)'],
  C: ['rgba(34,197,94,.18)',   'var(--green2)'],
  D: ['rgba(239,68,68,.18)',   'var(--red2)'],
};

const urlParams = new URLSearchParams(location.search);
const klubbId    = urlParams.get('klubb');
let   eventId    = urlParams.get('event');

const headerEl = document.getElementById('mv-header');
const appEl    = document.getElementById('mv-app');

function esc(str) {
  return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ════════════════════════════════════════════════════════
// HEADER
// ════════════════════════════════════════════════════════
function renderHeader(event) {
  if (!event) { headerEl.innerHTML = ''; return; }
  const erLive = event.status === 'puljespill' || event.status === 'sluttspill';
  const pill = erLive
    ? `<span class="mv-live-pill"><span class="mv-live-dot"></span>LIVE</span>`
    : event.status === 'ferdig'
      ? `<span class="mv-ferdig-pill">✓ Avsluttet</span>`
      : `<span class="mv-ferdig-pill">Venter på start</span>`;

  headerEl.innerHTML = `
    <div class="mv-header-venstre">
      <span class="mv-klubb">${esc(KLUBB_NAVN[klubbId] ?? klubbId ?? '')}</span>
      <span class="mv-tittel">${esc(event.navn ?? 'Mesteren')}</span>
    </div>
    <div class="mv-header-hoyre">
      ${pill}
      <button class="mv-fullskjerm-btn" onclick="window.mvVeksleFullskjerm?.()" title="Fullskjerm" aria-label="Fullskjerm">⛶</button>
    </div>`;
  oppdaterHeaderHoyde();
}

window.mvVeksleFullskjerm = function () {
  const el = document.documentElement;
  const erIFullskjerm = document.fullscreenElement || document.webkitFullscreenElement;
  if (!erIFullskjerm) (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
  else (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
};

function oppdaterHeaderHoyde() {
  const h = headerEl.offsetHeight;
  if (h > 0) document.documentElement.style.setProperty('--mv-header-h', `${h + 16}px`);
}
window.addEventListener('resize', oppdaterHeaderHoyde);

// ════════════════════════════════════════════════════════
// PULJEFASE — hver pulje viser sin egen gjeldende runde
// (første runde som ikke er ferdigspilt ennå, hvilerunder
// hoppes automatisk over), uavhengig av de andre puljene.
// ════════════════════════════════════════════════════════
function finnAktivRunde(pulje) {
  const rundeNumre = Object.keys(pulje.runder).map(k => Number(k.replace('runde', ''))).sort((a, b) => a - b);
  for (const nr of rundeNumre) {
    const r = pulje.runder[`runde${nr}`];
    if (r.hviler) continue;
    const alleFerdig = Object.values(r.kamper).every(k => k.ferdig);
    if (!alleFerdig) return { nr, runde: r, alleFerdig: false };
  }
  const sisteAktive = [...rundeNumre].reverse().find(nr => !pulje.runder[`runde${nr}`].hviler);
  return { nr: sisteAktive, runde: pulje.runder[`runde${sisteAktive}`], alleFerdig: true };
}

function navnFraId(event, id) {
  return esc(event.spillere.find(s => s.id === id)?.navn ?? '?');
}

function renderKampKort(event, kamp, disiplin) {
  const pagarKlasse = kamp.pagar ? ' pagar' : '';
  let resultatHtml;
  if (kamp.ferdig) resultatHtml = `<div class="mv-resultat">${kamp.poeng1} – ${kamp.poeng2}</div>`;
  else resultatHtml = `<div class="mv-resultat venter">Venter</div>`;
  const v1 = kamp.ferdig && kamp.poeng1 > kamp.poeng2;
  const v2 = kamp.ferdig && kamp.poeng2 > kamp.poeng1;
  const disiplinLabel = `${DISIPLIN_IKON[disiplin] ?? ''} ${DISIPLIN_NAVN[disiplin] ?? disiplin}`;
  return `
    <div class="mv-kort${pagarKlasse}">
      <div class="mv-kort-hdr">${disiplinLabel}${kamp.pagar ? ' <span class="mv-live-dot" style="width:6px;height:6px"></span>' : ''}</div>
      <div class="mv-par-rad${v1 ? ' vinner' : ''}">${navnFraId(event, kamp.par[0])}</div>
      <div class="mv-vs">mot</div>
      <div class="mv-par-rad${v2 ? ' vinner' : ''}">${navnFraId(event, kamp.par[1])}</div>
      ${resultatHtml}
    </div>`;
}

function renderPuljeKort(event, pulje) {
  const { nr, runde, alleFerdig } = finnAktivRunde(pulje);
  const [farge, tekst] = PULJE_FARGE[pulje.navn] ?? ['rgba(122,144,168,.18)', 'var(--muted2)'];
  const statusHtml = alleFerdig
    ? `<span class="mv-status-pill ferdig">✓ Puljespill ferdig</span>`
    : `<span class="mv-status-pill">Runde ${nr} av ${Object.keys(pulje.runder).length}</span>`;
  const kampeneHtml = Object.values(runde.kamper).map(k => renderKampKort(event, k, runde.disiplin)).join('');
  return `
    <div class="mv-oppgjor-kol">
      <div class="mv-oppgjor-hdr">
        <div class="mv-oppgjor-tittel"><span class="mv-pulje-merke" style="background:${farge};color:${tekst}">${pulje.navn}</span>Pulje ${pulje.navn}</div>
        <div class="mv-disiplin">${DISIPLIN_IKON[runde.disiplin] ?? ''} ${DISIPLIN_NAVN[runde.disiplin] ?? ''}</div>
      </div>
      ${statusHtml}
      <div class="mv-gruppe-grid">${kampeneHtml}</div>
    </div>`;
}

function renderTabellBlokk(event, pulje) {
  const rader = pulje.tabell ?? [];
  const [farge, tekst] = PULJE_FARGE[pulje.navn] ?? ['rgba(122,144,168,.18)', 'var(--muted2)'];
  const radHtml = rader.length
    ? rader.map(r => `
        <tr>
          <td class="mv-tabell-plass sentr" style="width:26px">${r.plass}</td>
          <td class="mv-tabell-navn">${navnFraId(event, r.spillerId)}</td>
          <td class="sentr" style="font-weight:700;color:var(--yellow)">${r.manuell ? '' : (r.poeng ?? '')}</td>
        </tr>`).join('')
    : `<tr><td colspan="3" style="padding:14px;text-align:center;color:var(--muted2);font-size:13px">Ingen resultater ennå</td></tr>`;
  return `
    <div class="mv-tabell-blokk">
      <div class="mv-tabell-hode"><span class="mv-pulje-merke" style="width:20px;height:20px;font-size:12px;background:${farge};color:${tekst}">${pulje.navn}</span>Pulje ${pulje.navn}</div>
      <table class="mv-tabell"><tbody>${radHtml}</tbody></table>
    </div>`;
}

// ════════════════════════════════════════════════════════
// ROTASJON — puljefasen veksler mellom to skjermtilstander
// (Pulje A+B, deretter C+D) hvert 30. sekund, i stedet for å
// vise alle puljene samtidig. Sidebaren roterer med, slik at
// den alltid viser tabellene for akkurat de puljene som er
// synlige. Timeren startes én gang når puljespill-fasen
// begynner, og stoppes når man forlater den (unngår at den
// fortsetter å kjøre i bakgrunnen på en langvarig TV-økt).
// ════════════════════════════════════════════════════════
const ROTASJON_MS = 30000;
let _rotasjonIndeks = 0;
let _rotasjonTimer = null;

function grupperPuljerForRotasjon(puljer) {
  const sortert = [...puljer].sort((a, b) => a.navn.localeCompare(b.navn, 'no'));
  const grupper = [];
  for (let i = 0; i < sortert.length; i += 2) grupper.push(sortert.slice(i, i + 2));
  return grupper;
}

function startRotasjonHvisNodvendig(antallGrupper) {
  if (_rotasjonTimer || antallGrupper <= 1) return;
  _rotasjonTimer = setInterval(() => {
    _rotasjonIndeks = (_rotasjonIndeks + 1) % antallGrupper;
    render();
  }, ROTASJON_MS);
}

function stoppRotasjon() {
  if (_rotasjonTimer) { clearInterval(_rotasjonTimer); _rotasjonTimer = null; }
  _rotasjonIndeks = 0;
}

function renderPuljefase(event, puljer) {
  if (!puljer.length) return `<div class="mv-tom">Puljene er ikke satt opp ennå.</div>`;
  const grupper = grupperPuljerForRotasjon(puljer);
  startRotasjonHvisNodvendig(grupper.length);
  const gruppeIndeks = _rotasjonIndeks % grupper.length;
  const synligePuljer = grupper[gruppeIndeks];

  const prikkerHtml = grupper.length > 1
    ? `<div class="mv-rotasjon-indikator">${grupper.map((_, i) => `<span class="mv-prikk${i === gruppeIndeks ? ' aktiv' : ''}"></span>`).join('')}</div>`
    : '';

  return `
    <div class="mv-pulje-body">
      <div class="mv-pulje-hoved">
        <div class="mv-pulje-grid">${synligePuljer.map(p => renderPuljeKort(event, p)).join('')}</div>
        ${prikkerHtml}
      </div>
      <div class="mv-pulje-sidebar">
        <div class="mv-seksjon-tittel">Stilling (foreløpig)</div>
        ${synligePuljer.map(p => renderTabellBlokk(event, p)).join('')}
      </div>
    </div>`;
}

// ════════════════════════════════════════════════════════
// SLUTTSPILLBRAKETT
// ════════════════════════════════════════════════════════
function renderSerieKort(event, tittel, serie, disiplinFast) {
  if (!serie || !serie.spiller1 || !serie.spiller2) {
    return `
      <div class="mv-brakett-kamp">
        <div class="mv-brakett-spiller"><span style="color:var(--muted2)">Venter …</span></div>
        <div class="mv-brakett-spiller"><span style="color:var(--muted2)">Venter …</span></div>
      </div>`;
  }
  const status = beregnSerieStatus(serie.delkamper);
  const pagarKlasse = !serie.avgjort && (status.seire1 > 0 || status.seire2 > 0) ? ' pagar' : '';
  const disiplinHtml = disiplinFast
    ? `<div class="mv-brakett-disiplin">Best av 3 disipliner</div>`
    : '';
  return `
    <div class="mv-brakett-kamp${pagarKlasse}">
      <div class="mv-brakett-spiller${serie.vinnerId === serie.spiller1 ? ' vinner' : ''}"><span>${navnFraId(event, serie.spiller1)}</span><span class="mv-brakett-poeng">${status.seire1}</span></div>
      <div class="mv-brakett-spiller${serie.vinnerId === serie.spiller2 ? ' vinner' : ''}"><span>${navnFraId(event, serie.spiller2)}</span><span class="mv-brakett-poeng">${status.seire2}</span></div>
      ${disiplinHtml}
    </div>`;
}

function renderSluttspill(event, sluttspill) {
  if (!sluttspill) return `<div class="mv-tom">Sluttspillet er ikke satt opp ennå.</div>`;
  return `
    <div class="mv-brakett">
      <div class="mv-brakett-kol">
        <div class="mv-brakett-kol-tittel">Kvartfinale</div>
        ${renderSerieKort(event, 'QF1', sluttspill.qf1)}
        ${renderSerieKort(event, 'QF2', sluttspill.qf2)}
        ${renderSerieKort(event, 'QF3', sluttspill.qf3)}
        ${renderSerieKort(event, 'QF4', sluttspill.qf4)}
      </div>
      <div class="mv-brakett-kol">
        <div class="mv-brakett-kol-tittel">Semifinale</div>
        <div style="margin-top:34px">${renderSerieKort(event, 'SF1', sluttspill.sf1)}</div>
        <div style="margin-top:120px">${renderSerieKort(event, 'SF2', sluttspill.sf2)}</div>
      </div>
      <div class="mv-brakett-kol" style="justify-content:center">
        <div class="mv-brakett-kol-tittel">Finale</div>
        ${renderSerieKort(event, 'Finale', sluttspill.finale, FINALE_DISIPLIN_REKKEFOLGE)}
      </div>
    </div>`;
}

// ════════════════════════════════════════════════════════
// VINNERSKJERM
// ════════════════════════════════════════════════════════
function renderVinnerskjerm(event, sluttspill, hallOfFame) {
  const vinnerId = event.vinnerId;
  const vinnerNavn = navnFraId(event, vinnerId);
  const finale = sluttspill?.finale;
  const status = finale ? beregnSerieStatus(finale.delkamper) : null;
  const taperId = finale ? (finale.spiller1 === vinnerId ? finale.spiller2 : finale.spiller1) : null;

  const subTekst = (finale && status)
    ? `Vant finalen ${Math.max(status.seire1, status.seire2)}–${Math.min(status.seire1, status.seire2)} over ${navnFraId(event, taperId)}`
    : '';

  const hofHtml = hallOfFame.length
    ? hallOfFame.map(h => `<div class="mv-hof-item"><b>${esc(h.navn)}</b> — ${h.eventseire} ${h.eventseire === 1 ? 'tittel' : 'titler'}</div>`).join('')
    : '';

  return `
    <div class="mv-vinner-scene">
      <div class="mv-vinner-emoji">🏆</div>
      <div class="mv-vinner-label">Mesteren er kåret</div>
      <div class="mv-vinner-navn">${vinnerNavn}</div>
      <div class="mv-vinner-sub">${esc(subTekst)}</div>
      ${hofHtml ? `<div class="mv-hof-strip">${hofHtml}</div>` : ''}
    </div>`;
}

// ════════════════════════════════════════════════════════
// HOVEDRENDER — velger fase ut fra event.status
// ════════════════════════════════════════════════════════
let _event = null, _puljer = [], _sluttspill = null, _hallOfFame = [];

function render() {
  renderHeader(_event);
  if (!_event) return;

  if (_event.status !== 'puljespill') stoppRotasjon();

  if (_event.status === 'oppsett') {
    appEl.innerHTML = `<div class="mv-tom">${esc(_event.navn)} venter på å starte …<br><span style="font-size:14px;color:var(--muted)">Siden oppdateres automatisk når puljespillet begynner.</span></div>`;
  } else if (_event.status === 'puljespill') {
    appEl.innerHTML = renderPuljefase(_event, _puljer);
  } else if (_event.status === 'sluttspill') {
    appEl.innerHTML = renderSluttspill(_event, _sluttspill);
  } else if (_event.status === 'ferdig') {
    appEl.innerHTML = renderVinnerskjerm(_event, _sluttspill, _hallOfFame);
  }
}

// ════════════════════════════════════════════════════════
// LIVE-ABONNEMENT
// ════════════════════════════════════════════════════════
let unsubEvent = null, unsubPuljer = null, unsubSluttspill = null, unsubEventListe = null;
let _abonnertFase = null; // holder styr på hvilken fase vi sist bygde sub-abonnement for

function ryddOppSubAbonnement() {
  if (unsubPuljer) { unsubPuljer(); unsubPuljer = null; }
  if (unsubSluttspill) { unsubSluttspill(); unsubSluttspill = null; }
}

async function synkroniserSubAbonnement() {
  if (!_event) return;
  if (_event.status === _abonnertFase) return; // ingen endring i fase, ikke bygg om abonnement
  _abonnertFase = _event.status;
  ryddOppSubAbonnement();

  if (_event.status === 'puljespill') {
    unsubPuljer = onSnapshot(
      query(collection(db, SAM.PROVEN_PULJER), where('eventId', '==', _event.id)),
      snap => { _puljer = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }
    );
  } else if (_event.status === 'sluttspill' || _event.status === 'ferdig') {
    if (_event.sluttspillId) {
      unsubSluttspill = onSnapshot(doc(db, SAM.PROVEN_SLUTTSPILL, _event.sluttspillId), snap => {
        _sluttspill = snap.exists() ? { id: snap.id, ...snap.data() } : null;
        render();
      });
    }
    if (_event.status === 'ferdig') {
      hentHallOfFame(); // engangshenting — endrer seg sjelden, trenger ikke live-abonnement
    }
  }
}

async function hentHallOfFame() {
  try {
    const spillerIder = _event.spillere.map(s => s.id);
    const livstid = await hentLivstidForSpillere(spillerIder); // { spillerId: {antallEventer, kampseire, finaler, eventseire} }
    const rangert = Object.entries(livstid)
      .map(([spillerId, data]) => ({ spillerId, eventseire: data.eventseire ?? 0 }))
      .filter(h => h.eventseire > 0)
      .sort((a, b) => b.eventseire - a.eventseire)
      .slice(0, 3);
    _hallOfFame = rangert.map(h => ({
      navn: _event.spillere.find(s => s.id === h.spillerId)?.navn ?? h.spillerId,
      eventseire: h.eventseire,
    }));
  } catch (e) {
    console.warn('[Mesteren-viewer] Kunne ikke hente Hall of Fame:', e?.message);
    _hallOfFame = [];
  }
  render();
}

function abonnerPaEvent(id) {
  if (unsubEvent) unsubEvent();
  eventId = id;
  _abonnertFase = null;
  unsubEvent = onSnapshot(doc(db, SAM.PROVEN_EVENTER, id), snap => {
    if (!snap.exists()) {
      appEl.innerHTML = `<div class="mv-tom">Fant ikke eventet.</div>`;
      return;
    }
    _event = { id: snap.id, ...snap.data() };
    synkroniserSubAbonnement();
    render();
  });
}

/** Klientsortert i stedet for orderBy+where('in',...) i spørringen — unngår å kreve en egen composite-indeks. */
function velgBesteEvent(alle) {
  const aktive = alle.filter(e => e.status !== 'ferdig' && e.status !== 'slettet');
  const kandidater = aktive.length ? aktive : alle.filter(e => e.status === 'ferdig');
  kandidater.sort((a, b) => (b.opprettet?.seconds ?? 0) - (a.opprettet?.seconds ?? 0));
  return kandidater[0]?.id ?? null;
}

function startOpp() {
  if (!db) {
    appEl.innerHTML = `<div class="mv-tom">Firebase er ikke konfigurert.</div>`;
    return;
  }
  if (!klubbId) {
    appEl.innerHTML = `<div class="mv-tom">Mangler klubb i lenken.<br><span style="font-size:14px;color:var(--muted)">Bruk f.eks. mesteren-viewer.html?klubb=demo</span></div>`;
    return;
  }
  if (eventId) {
    abonnerPaEvent(eventId);
    return;
  }
  // Ingen event oppgitt i lenken — finn siste relevante event for klubben automatisk, og hold det oppdatert live.
  unsubEventListe = onSnapshot(
    query(collection(db, SAM.PROVEN_EVENTER), where('klubbId', '==', klubbId)),
    snap => {
      const alle = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      const beste = velgBesteEvent(alle);
      if (!beste) {
        appEl.innerHTML = `<div class="mv-tom">Ingen Mesteren-eventer ennå.<br><span style="font-size:14px;color:var(--muted)">Siden oppdateres automatisk når et event opprettes.</span></div>`;
        return;
      }
      if (beste !== eventId) abonnerPaEvent(beste);
    }
  );
}

startOpp();
</script>
